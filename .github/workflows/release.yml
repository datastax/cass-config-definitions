name: Release Artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Build artifacts
        run: ./gradlew dist
      
      - name: Verify artifacts
        run: |
          ls -lh build/
          echo "MD5 Hash:"
          cat build/version.md5
      
      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Configuration Definitions Release ${{ steps.get_version.outputs.VERSION }}
            
            This release contains the latest Cassandra/DSE configuration definitions.
            
            ### Artifacts
            - `definition_files.tgz` - Compressed archive of all configuration definitions
            - `version.md5` - MD5 checksum for version verification
            
            ### Usage
            Download the artifacts using:
            ```bash
            curl -L -o definition_files.tgz https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.VERSION }}/definition_files.tgz
            curl -L -o version.md5 https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.VERSION }}/version.md5
            ```
            
            Or use the latest release URLs:
            ```bash
            curl -L -o definition_files.tgz https://github.com/${{ github.repository }}/releases/latest/download/definition_files.tgz
            curl -L -o version.md5 https://github.com/${{ github.repository }}/releases/latest/download/version.md5
            ```
          files: |
            build/definition_files.tgz
            build/version.md5
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
